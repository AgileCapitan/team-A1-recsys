name: Deploy to Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      model_key:
        description: "B2 object key for model bundle (e.g. models/movielens-v1/movielens-v1.joblib)"
        required: false
        default: ""
      catalog_key:
        description: "B2 object key for movie catalog CSV (defaults to SERVING_CATALOG_KEY or processed/movielens-1m/v1/movies.csv)"
        required: false
        default: ""
      expected_version:
        description: "Expected model_version in bundle (optional verification)"
        required: false
        default: ""
      mlflow_run_id:
        description: "MLflow run ID recorded in staged-version.json (optional)"
        required: false
        default: ""

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Resolve staging configuration
        id: config
        env:
          INPUT_MODEL_KEY: ${{ inputs.model_key }}
          INPUT_CATALOG_KEY: ${{ inputs.catalog_key }}
          INPUT_EXPECTED_VERSION: ${{ inputs.expected_version }}
          INPUT_MLFLOW_RUN_ID: ${{ inputs.mlflow_run_id }}
          VAR_MODEL_KEY: ${{ vars.SERVING_MODEL_KEY }}
          VAR_CATALOG_KEY: ${{ vars.SERVING_CATALOG_KEY }}
          VAR_EXPECTED_VERSION: ${{ vars.SERVING_MODEL_VERSION }}
          VAR_MLFLOW_RUN_ID: ${{ vars.SERVING_MLFLOW_RUN_ID }}
        run: |
          MODEL_KEY="${INPUT_MODEL_KEY:-$VAR_MODEL_KEY}"
          CATALOG_KEY="${INPUT_CATALOG_KEY:-${VAR_CATALOG_KEY:-processed/movielens-1m/v1/movies.csv}}"
          EXPECTED_VERSION="${INPUT_EXPECTED_VERSION:-$VAR_EXPECTED_VERSION}"
          MLFLOW_RUN_ID="${INPUT_MLFLOW_RUN_ID:-$VAR_MLFLOW_RUN_ID}"

          if [ -n "$MODEL_KEY" ]; then
            echo "should_stage=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_stage=false" >> "$GITHUB_OUTPUT"
          fi
          echo "model_key=$MODEL_KEY" >> "$GITHUB_OUTPUT"
          echo "catalog_key=$CATALOG_KEY" >> "$GITHUB_OUTPUT"
          echo "expected_version=$EXPECTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "mlflow_run_id=$MLFLOW_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Checkout repository for artifact validation
        if: steps.config.outputs.should_stage == 'true'
        uses: actions/checkout@v4

      - name: Set up Python for artifact validation
        if: steps.config.outputs.should_stage == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install backend serving dependencies
        if: steps.config.outputs.should_stage == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Download and validate serving artifacts from B2
        if: steps.config.outputs.should_stage == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.B2_REGION }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
          B2_BUCKET: ${{ vars.B2_BUCKET }}
          MODEL_KEY: ${{ steps.config.outputs.model_key }}
          CATALOG_KEY: ${{ steps.config.outputs.catalog_key }}
          EXPECTED_VERSION: ${{ steps.config.outputs.expected_version }}
          MLFLOW_RUN_ID: ${{ steps.config.outputs.mlflow_run_id }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ] || [ -z "$B2_BUCKET" ] || [ -z "$B2_ENDPOINT" ]; then
            echo "Missing required B2 secrets/variables for artifact staging."
            exit 1
          fi

          mkdir -p staged_artifacts
          aws s3 cp "s3://$B2_BUCKET/$MODEL_KEY" staged_artifacts/movielens-v1.joblib --endpoint-url "$B2_ENDPOINT"
          aws s3 cp "s3://$B2_BUCKET/$CATALOG_KEY" staged_artifacts/movie-catalog.csv --endpoint-url "$B2_ENDPOINT"

          python -m src.serving.stage_artifacts validate \
            --model staged_artifacts/movielens-v1.joblib \
            --catalog staged_artifacts/movie-catalog.csv \
            --model-key "$MODEL_KEY" \
            --catalog-key "$CATALOG_KEY" \
            --expected-version "$EXPECTED_VERSION" \
            --mlflow-run-id "$MLFLOW_RUN_ID" \
            --git-sha "$GITHUB_SHA" \
            --manifest staged_artifacts/staged-version.json

          (cd staged_artifacts && sha256sum movielens-v1.joblib movie-catalog.csv staged-version.json > SHA256SUMS)

      - name: Transfer validated artifacts to Oracle VM staging directory
        if: steps.config.outputs.should_stage == 'true'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          SSH_KEY_FILE=$(mktemp)
          trap 'rm -f "$SSH_KEY_FILE"' EXIT
          printf '%s\n' "$VM_SSH_KEY" > "$SSH_KEY_FILE"
          chmod 600 "$SSH_KEY_FILE"

          SSH_OPTS="-i $SSH_KEY_FILE -o StrictHostKeyChecking=accept-new"
          REMOTE_REPO=$(ssh $SSH_OPTS "$VM_USER@$VM_HOST" 'cd ~/team-A1-recsys 2>/dev/null || cd team-A1-recsys; pwd')

          ssh $SSH_OPTS "$VM_USER@$VM_HOST" "rm -rf '$REMOTE_REPO/.artifacts-staging' && mkdir -p '$REMOTE_REPO/.artifacts-staging'"
          scp $SSH_OPTS \
            staged_artifacts/movielens-v1.joblib \
            staged_artifacts/movie-catalog.csv \
            staged_artifacts/staged-version.json \
            staged_artifacts/SHA256SUMS \
            "$VM_USER@$VM_HOST:$REMOTE_REPO/.artifacts-staging/"

          ssh $SSH_OPTS "$VM_USER@$VM_HOST" "cd '$REMOTE_REPO/.artifacts-staging' && sha256sum -c SHA256SUMS"

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          SHOULD_STAGE: ${{ steps.config.outputs.should_stage }}
          EXPECTED_VERSION: ${{ steps.config.outputs.expected_version }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          envs: SHOULD_STAGE,EXPECTED_VERSION
          script_stop: true
          script: |
            echo "Navigating to repository directory..."
            cd ~/team-A1-recsys || cd team-A1-recsys

            echo "Fetching latest changes from origin..."
            git fetch origin main
            git reset --hard origin/main

            if [ "$SHOULD_STAGE" = "true" ]; then
              echo "Promoting validated serving artifacts into artifacts/..."
              test -s .artifacts-staging/movielens-v1.joblib
              test -s .artifacts-staging/movie-catalog.csv
              test -s .artifacts-staging/staged-version.json
              mkdir -p artifacts
              mv -f .artifacts-staging/movielens-v1.joblib artifacts/movielens-v1.joblib
              mv -f .artifacts-staging/movie-catalog.csv artifacts/movie-catalog.csv
              mv -f .artifacts-staging/staged-version.json artifacts/staged-version.json
              rm -rf .artifacts-staging
            fi

            echo "Rebuilding and restarting Docker containers..."
            docker compose up -d --build --remove-orphans

            echo "Waiting for backend health endpoint..."
            for i in $(seq 1 30); do
              if curl -sf http://localhost:8000/health > /tmp/backend_health.json; then
                break
              fi
              sleep 1
            done
            cat /tmp/backend_health.json

            if [ "$SHOULD_STAGE" = "true" ]; then
              echo "Verifying container artifact readability and active model version..."
              docker compose exec -T backend test -r /app/artifacts/movielens-v1.joblib
              docker compose exec -T backend test -r /app/artifacts/movie-catalog.csv
              docker compose exec -T backend test -r /app/artifacts/staged-version.json
              python3 -c '
              import json, os
              health = json.load(open("/tmp/backend_health.json"))
              assert health.get("artifact_loaded") is True, f"artifact not loaded: {health}"
              assert health.get("catalog_loaded") is True, f"catalog not loaded: {health}"
              assert health.get("using_fallback") is False, f"unexpected fallback: {health}"
              expected = os.getenv("EXPECTED_VERSION", "").strip()
              if expected:
                  assert health.get("model_version") == expected, f"version mismatch: {health}"
              print("Verified deployed model:", health["model_version"])
              '
            fi

            echo "Cleaning dangling images to preserve disk space..."
            docker image prune -f

            echo "Deployment completed successfully!"
