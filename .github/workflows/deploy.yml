name: Deploy to Cloud VM

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Check VM listeners and firewall for ports 80 and 443
        type: boolean
        default: false

jobs:
  preflight:
    name: Check Oracle VM network settings
    if: github.event_name == 'workflow_dispatch' && inputs.preflight_only
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect web ports via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -eu
            export LC_ALL=C

            if command -v ss >/dev/null 2>&1; then
              for port in 80 443; do
                listeners=$(ss -H -ltn "sport = :$port")
                if [ -n "$listeners" ]; then
                  echo "TCP $port: listening socket present"
                else
                  echo "TCP $port: no listening socket reported"
                fi
              done
            else
              echo "Socket status unavailable: ss is not installed."
            fi

            if command -v ufw >/dev/null 2>&1; then
              if ufw_status=$(sudo -n ufw status 2>/dev/null); then
                printf '%s\n' "$ufw_status" | awk '/^Status: / { print "UFW " $0 }'
              else
                echo "UFW status unavailable to the deploy account."
              fi
            fi

            if rules=$(sudo -n iptables -S INPUT 2>/dev/null); then
              printf '%s\n' "$rules" | awk '
                $1 == "-P" { print "IPv4 INPUT default policy: " $3 }
                /^-A INPUT -j (DROP|REJECT)( |$)/ {
                  print "IPv4 INPUT catch-all rule: " $4
                }
                /--dports? (80|443)([ ,]|$)/ {
                  for (i = 1; i < NF; i++) {
                    if ($i == "-j") print "IPv4 INPUT web-port rule target: " $(i + 1)
                  }
                }
              '
            else
              echo "IPv4 INPUT rules unavailable to the deploy account."
            fi

  test:
    name: Run Automated Tests
    if: github.event_name != 'workflow_dispatch' || !inputs.preflight_only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: |
          pytest

  deploy:
    name: Deploy to Oracle Cloud VM
    needs: test
    runs-on: ubuntu-latest
    if: ${{ !inputs.preflight_only && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') }}
    steps:
      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_SHA: ${{ github.sha }}
          MLFLOW_AUTH_PASSWORD_HASH: ${{ secrets.MLFLOW_AUTH_PASSWORD_HASH }}
        with:
          envs: DEPLOY_SHA,MLFLOW_AUTH_PASSWORD_HASH
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            set -eu

            if [ -z "${MLFLOW_AUTH_PASSWORD_HASH:-}" ]; then
              echo "Set the MLFLOW_AUTH_PASSWORD_HASH repository Actions secret before deploying." >&2
              exit 1
            fi

            echo "Navigating to repository directory..."
            cd ~/team-A1-recsys || cd team-A1-recsys

            echo "Fetching requested deployment commit..."
            git fetch origin "$DEPLOY_SHA"
            git reset --hard FETCH_HEAD

            echo "Configuring MLflow authentication and route prefixes..."
            mlflow_env_file=$(mktemp .env.mlflow.XXXXXX)
            trap 'rm -f -- "$mlflow_env_file"' EXIT
            if [ -f .env ]; then
              awk '!/^[[:space:]]*(export[[:space:]]+)?(MLFLOW_AUTH_PASSWORD_HASH|API_ROOT_PATH|MLFLOW_STATIC_PREFIX)[[:space:]]*([=:]|$)/' .env > "$mlflow_env_file"
            fi
            printf "MLFLOW_AUTH_PASSWORD_HASH='%s'\nAPI_ROOT_PATH=/api\nMLFLOW_STATIC_PREFIX=/mlflow\n" \
              "$MLFLOW_AUTH_PASSWORD_HASH" >> "$mlflow_env_file"
            mv -f -- "$mlflow_env_file" .env

            echo "Rebuilding and restarting Docker containers..."
            docker compose --profile mlflow up -d --build --remove-orphans

            echo "Cleaning dangling images to preserve disk space..."
            docker image prune -f

            echo "Deployment completed successfully!"
