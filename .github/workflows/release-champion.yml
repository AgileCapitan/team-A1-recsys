name: Release evaluated champion

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: champion-release
  cancel-in-progress: false

jobs:
  release:
    # Enable only after #29–30 / #38–40 supply the documented decision contract.
    if: vars.CHAMPION_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI || 'https://team-a1-recsys.duckdns.org/mlflow' }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME || 'mlflow' }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_HTTP_REQUEST_TIMEOUT: "30"
      MLFLOW_HTTP_REQUEST_MAX_RETRIES: "2"
      B2_BUCKET: ${{ vars.B2_BUCKET }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_REGION: ${{ vars.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      GH_TOKEN: ${{ github.token }}
      REGISTERED_MODEL: ${{ vars.CHAMPION_REGISTERED_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Release or reconcile the evaluated champion
        run: |
          test -n "$REGISTERED_MODEL"
          test -n "$MLFLOW_TRACKING_PASSWORD"
          case "$MLFLOW_TRACKING_URI" in https://*) ;; *) exit 1 ;; esac
          python -m src.serving.release_champion --registered-model "$REGISTERED_MODEL"
