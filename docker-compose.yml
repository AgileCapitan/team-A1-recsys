services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: recsys-backend:latest
    container_name: recsys-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - recsys-network

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: recsys-frontend:latest
    container_name: recsys-frontend
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    environment:
      - API_URL=http://backend:8000
      - PORT=8501
      - PYTHONUNBUFFERED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - recsys-network

networks:
  recsys-network:
    driver: bridge
